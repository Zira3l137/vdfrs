[package]
name = "vdfrs"
description = "A file explorer for the ZenGin's .vdf and .mod archives, built on zenkit-rs"
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Zira3l137/vdfrs"
keywords = ["gothic", "zengin", "vdf", "archive", "gui"]
categories = ["game-development", "gui"]
publish = false

[dependencies]
# The command line the Explorer context menu calls.
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-kit = "0.11"
# GPUI draws images from `image` frames; the explorer hands it decoded textures.
image = { version = "0.25", default-features = false }
rayon = "1.12"
smallvec = "1"
zenkit = { package = "zenkit-rs", version = "0.1.2", default-features = false, features = [
    "vfs",
    "texture",
    "parallel",
] }

# Dragging files out of the window: GPUI's Windows backend has no outbound drag yet, so the
# explorer starts the shell's own.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
winreg = "0.56"

# Puts the icon in the Windows executable, where GPUI looks for the window's icon and the registry
# entries point Explorer to.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.rust]
# Only the shell's drag on Windows needs unsafe code, and allows it right there.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# GPUI is slow unoptimised; the explorer's own code stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 2
debug = false
