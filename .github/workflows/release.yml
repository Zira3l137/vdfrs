# Builds vdfrs for Windows and Linux and publishes them as the release of a tag like v0.2.0.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: vdfrs.exe
            asset: vdfrs-windows-x64.exe
          - os: ubuntu-latest
            binary: vdfrs
            asset: vdfrs-linux-x64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GPUI's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libvulkan-dev libfontconfig-dev
      - name: Check that the tag is the package's version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - run: cargo build --locked --release
      - shell: bash
        run: mkdir dist && cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: |
          gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --generate-notes \
            --title "vdfrs $GITHUB_REF_NAME"
